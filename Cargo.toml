[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/chain-types",
    "crates/fmd-crypto",
    "crates/database",
    "crates/prices",
    "crates/ingester",
    "crates/fmd-indexer",
    "crates/explorer-indexer",
    "crates/fmd-webserver",
    "crates/explorer-webserver",
    "crates/relayer",
    "crates/metaquoter",
    "crates/risk-webserver",
    "crates/integration-tests",
    "crates/test-support",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# async runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
futures = "0.3"

# http
axum = "0.8.9"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "set-header", "timeout"] }

# openapi / swagger
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# db
diesel = { version = "2.2", features = ["postgres", "chrono", "numeric", "serde_json", "32-column-tables"] }
bigdecimal = { version = "0.4", features = ["serde"] }
diesel-async = { version = "0.5", features = ["postgres", "bb8"] }
# LISTEN/NOTIFY only. diesel-async already resolves this exact version and
# connects with `NoTls`; pinning to the same one keeps a single client in the
# tree and the listener's connection identical to every pooled one.
tokio-postgres = "0.7"
diesel_migrations = { version = "2.2", features = ["postgres"] }
bb8 = "0.8"

# evm
alloy = { version = "0.5", default-features = false, features = [
    "std",
    "providers",
    "rpc-types-eth",
    "sol-types",
    "contract",
    "signer-local",
    "network",
    # The relayer's submitter matches on `RpcError::ErrorResp(ErrorPayload)` to
    # distinguish a node that refused a broadcast from one that never answered,
    # which requires the payload type to be nameable.
    "json-rpc",
    "transport-http",
    "reqwest-rustls-tls",
] }

# serde
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"

# error
thiserror = "1"
anyhow = "1"

# tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# metrics
#
# The facade is unconditional in `shared`: with no recorder installed every macro
# is a no-op, so binaries that expose no `/metrics` pay nothing for the shared
# instrumentation sites such as `shared::tick::run`.
metrics = "0.24"
# `default-features = false` drops push-gateway, rustls and hyper-rustls. Only
# `http-listener` is needed: the exporter serves the scrape endpoint itself, so
# `fmd-indexer` needs no axum server of its own.
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }

# config
dotenvy = "0.15"

# crypto (FMD crates only)
#
# Pinned to arkworks 0.4 by `light-poseidon`, not by preference. `fmd-crypto`
# calls `get_poseidon_parameters::<Fq>()` with its own field type, and that
# function is bounded on `light-poseidon`'s ark-ff, so the two versions cannot
# diverge. light-poseidon 0.2 requires ark 0.4; its latest release (0.4) requires
# ark 0.5. Neither supports 0.6.
#
# The relayer is therefore on ark 0.6 and declares those deps locally rather than
# here — `ark-groth16 0.6` is what its Groth16 prover needs. The two sets never
# exchange types, so the split is inert. Unifying would mean dropping
# light-poseidon and vendoring circomlib's `bn254_x5` tables (~43k generated
# lines of round constants), which is not worth it to tidy a manifest.
light-poseidon = "0.2"
ark-ed-on-bn254 = "0.4"
ark-ff = "0.4"
ark-ec = "0.4"
ark-serialize = "0.4"
blake2 = "0.10"
chacha20poly1305 = "0.10"
zeroize = "1"
num-bigint = "0.4"
num-traits = "0.2"

# bech32m shielded payment addresses (relayer only)
bech32 = "0.11"

# parallelism (fmd-indexer filter)
rayon = "1.10"

# caching
moka = { version = "0.12", features = ["future"] }

# http client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# misc
hex = "0.4"
rand = "0.9"
sha2 = "0.10"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"

# testing
mockall = "0.13"
vergen-gix = { version = "9", features = ["build", "cargo", "rustc"] }

testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }

# The FMD filter is field arithmetic throughout, with arkworks generics inlined
# across crate boundaries, so cross-crate optimisation pays off. Measured on the
# `clue_breakdown` bench: batched scalar multiplication -10%, Poseidon -3%, the
# whole `test_clue_batch` path -3%.
#
# `thin` rather than `fat`: it measured the same here and builds far faster.
# `target-cpu=native` gained about 0.5% and would tie the release binary to the
# machine that built it, so it is not used.
[profile.release]
lto = "thin"
codegen-units = 1
