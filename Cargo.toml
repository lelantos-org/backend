[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/chain-types",
    "crates/fmd-crypto",
    "crates/database",
    "crates/ingester",
    "crates/fmd-indexer",
    "crates/explorer-indexer",
    "crates/fmd-webserver",
    "crates/explorer-webserver",
    "crates/relayer",
    "crates/metaquoter",
    "crates/risk-webserver",
    "crates/integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# async runtime
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
futures = "0.3"

# http
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "set-header"] }

# openapi / swagger
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }

# db
diesel = { version = "2.2", features = ["postgres", "chrono", "numeric", "serde_json", "32-column-tables"] }
bigdecimal = { version = "0.4", features = ["serde"] }
diesel-async = { version = "0.5", features = ["postgres", "bb8"] }
diesel_migrations = { version = "2.2", features = ["postgres"] }
bb8 = "0.8"

# evm
alloy = { version = "0.5", default-features = false, features = [
    "std",
    "providers",
    "rpc-types-eth",
    "sol-types",
    "contract",
    "signer-local",
    "network",
    "transport-http",
    "reqwest-rustls-tls",
] }

# serde
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"

# error
thiserror = "1"
anyhow = "1"

# tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# config
dotenvy = "0.15"

# crypto (fmd-crypto only)
light-poseidon = "0.2"
ark-ed-on-bn254 = "0.4"
ark-ff = "0.4"
ark-ec = "0.4"
ark-serialize = "0.4"
blake2 = "0.10"
num-bigint = "0.4"
num-traits = "0.2"

# parallelism (fmd-indexer filter)
rayon = "1.10"

# caching
moka = { version = "0.12", features = ["future"] }

# http client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# misc
hex = "0.4"
rand = "0.9"
sha2 = "0.10"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"

# testing
mockall = "0.13"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }

# The FMD filter is field arithmetic through and through: arkworks generics
# inlined across crate boundaries, so cross-crate optimisation is worth real
# time. Measured on the `clue_breakdown` bench: batched scalar mul -10%,
# Poseidon -3%, whole `test_clue_batch` path -3%.
#
# `thin` rather than `fat` — it measured the same here and builds far faster.
# `target-cpu=native` was also tried and is deliberately absent: it bought
# ~0.5% and would tie the release binary to the machine that built it.
[profile.release]
lto = "thin"
codegen-units = 1
