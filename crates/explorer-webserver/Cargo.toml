[package]
name = "explorer-webserver"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "explorer-webserver"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared", features = ["webserver", "metrics-exporter"] }
asset-registry = { path = "../asset-registry", features = ["http"] }
database = { path = "../database" }
prices = { path = "../prices" }
# NOTE: must NOT depend on common-crypto. Privacy gate; a convention, not a CI
# check, so a new dependency edge here has to be caught in review.
tokio = { workspace = true }
axum = { workspace = true }
bigdecimal = { workspace = true }
diesel = { workspace = true }
diesel-async = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
dotenvy = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }

[build-dependencies]
vergen-gix = { workspace = true }
anyhow = { workspace = true }
