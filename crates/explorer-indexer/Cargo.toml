[package]
name = "explorer-indexer"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "explorer-indexer"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }
database = { path = "../database" }
chain-types = { path = "../chain-types" }
# NOTE: must NOT depend on crypto. Privacy gate; a convention caught in
# review, not by CI — see the README.
tokio = { workspace = true }
diesel = { workspace = true }
diesel-async = { workspace = true }
# Primitive types only (`Address`, `U256`) as they arrive from `chain-types`'s
# decode. No provider, no transport: this crate opens no RPC connection.
alloy = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
dotenvy = { workspace = true }
bigdecimal = { workspace = true }
async-trait = { workspace = true }

[build-dependencies]
vergen-gix = { workspace = true }
