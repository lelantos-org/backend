[package]
name = "ingester"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ingester"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared", features = ["metrics-exporter"] }
database = { path = "../database" }
chain-types = { path = "../chain-types" }
tokio = { workspace = true }
futures = { workspace = true }
diesel = { workspace = true }
diesel-async = { workspace = true }
bb8 = { workspace = true }
alloy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
dotenvy = { workspace = true }
url = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
test-support = { path = "../test-support" }
# `test-util` gives the adaptive-window tests a paused clock, so how many
# `eth_getLogs` overlap is asserted rather than raced for.
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
vergen-gix = { workspace = true }
