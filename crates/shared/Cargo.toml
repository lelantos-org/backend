[package]
name = "shared"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
futures = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
moka = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }

[dev-dependencies]
# The metrics cardinality test drives a real axum router through the layer:
# `tower::ServiceExt::oneshot` is how it dispatches without binding a port.
tower = { workspace = true }
# `test-util` gives the tick-driver tests a paused clock, so their timing
# assertions are exact virtual durations rather than wall-clock tolerances.
tokio = { workspace = true, features = ["test-util"] }

[features]
default = []
webserver = ["dep:axum", "dep:moka", "dep:tower-http"]
# Pulls in the Prometheus exporter and its listener. Only the binaries that
# actually serve `/metrics` enable it; the `metrics` facade above is always
# compiled, so instrumentation sites are shared without the hyper dependency.
metrics-exporter = ["dep:metrics-exporter-prometheus"]
