[package]
name = "shared"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
toml = { workspace = true }
futures = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
moka = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
# Conditional-GET support in `router::etag`. Optional for the same reason axum
# is: a crate that only wants the tick driver must not link a hasher.
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

[dev-dependencies]
# The metrics cardinality test drives a real axum router through the layer:
# `tower::ServiceExt::oneshot` is how it dispatches without binding a port.
tower = { workspace = true }
# `test-util` gives the tick-driver tests a paused clock, so their timing
# assertions are exact virtual durations rather than wall-clock tolerances.
tokio = { workspace = true, features = ["test-util"] }

[features]
default = []
# The moka cache builder, on its own switch. Split out of `webserver` so a
# library that wants a cache does not have to link an HTTP framework to get
# one; `asset-registry` is the first such consumer.
cache = ["dep:moka"]
webserver = ["dep:axum", "dep:tower-http", "dep:sha2", "dep:hex", "cache"]
# Pulls in the Prometheus exporter and its listener. Only the binaries that
# actually serve `/metrics` enable it; the `metrics` facade above is always
# compiled, so instrumentation sites are shared without the hyper dependency.
metrics-exporter = ["dep:metrics-exporter-prometheus"]
