# Each test runs in its own process, and each database-backed test process gets
# its own database cloned from a migrated template (crates/test-support), so the
# whole workspace runs in parallel.

[profile.default]
# Flag a test after 30s and kill it after 120s: a hung database or RPC wait
# fails the run instead of stalling it.
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci]
fail-fast = false
failure-output = "immediate-final"

[profile.ci.junit]
# target/nextest/ci/junit.xml, uploaded by .github/workflows/rust.yml.
path = "junit.xml"
