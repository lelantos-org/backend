name: Docker

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-[a-z]+"

concurrency:
  group: ${{ github.ref }}-docker
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  packages: write
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: self-hosted
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Detect file changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'crates/shared/**'
              - 'crates/database/**'
              - 'crates/chain-types/**'
              - 'Dockerfile'
              - '.github/workflows/docker.yml'
            ingester:
              - 'crates/ingester/**'
            fmd-indexer:
              - 'crates/fmd-indexer/**'
              - 'crates/fmd-crypto/**'
            explorer-indexer:
              - 'crates/explorer-indexer/**'
            fmd-webserver:
              - 'crates/fmd-webserver/**'
              - 'crates/fmd-crypto/**'
            explorer-webserver:
              - 'crates/explorer-webserver/**'
            relayer:
              - 'crates/relayer/**'
            risk-webserver:
              - 'crates/risk-webserver/**'
      - name: Build matrix
        id: set-matrix
        env:
          BUILD_ALL: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          SHARED: ${{ steps.filter.outputs.shared }}
          CHANGED_INGESTER: ${{ steps.filter.outputs.ingester }}
          CHANGED_FMD_INDEXER: ${{ steps.filter.outputs.fmd-indexer }}
          CHANGED_EXPLORER_INDEXER: ${{ steps.filter.outputs.explorer-indexer }}
          CHANGED_FMD_WEBSERVER: ${{ steps.filter.outputs.fmd-webserver }}
          CHANGED_EXPLORER_WEBSERVER: ${{ steps.filter.outputs.explorer-webserver }}
          CHANGED_RELAYER: ${{ steps.filter.outputs.relayer }}
          CHANGED_RISK_WEBSERVER: ${{ steps.filter.outputs.risk-webserver }}
        run: |
          all_images='[
            {"image":"ingester",           "package":"ingester",           "needs_shared":true},
            {"image":"fmd-indexer",        "package":"fmd-indexer",        "needs_shared":true},
            {"image":"explorer-indexer",   "package":"explorer-indexer",   "needs_shared":true},
            {"image":"fmd-webserver",      "package":"fmd-webserver",      "needs_shared":true},
            {"image":"explorer-webserver", "package":"explorer-webserver", "needs_shared":true},
            {"image":"relayer",            "package":"relayer",            "needs_shared":true},
            {"image":"risk-webserver",     "package":"risk-webserver",     "needs_shared":true}
          ]'

          if [ "$BUILD_ALL" == "true" ]; then
            matrix=$(echo "$all_images" | jq -c '[.[] | del(.needs_shared)]')
          else
            matrix=$(echo "$all_images" | jq -c \
              --arg shared "$SHARED" \
              --arg ingester "$CHANGED_INGESTER" \
              --arg fmd_indexer "$CHANGED_FMD_INDEXER" \
              --arg explorer_indexer "$CHANGED_EXPLORER_INDEXER" \
              --arg fmd_webserver "$CHANGED_FMD_WEBSERVER" \
              --arg explorer_webserver "$CHANGED_EXPLORER_WEBSERVER" \
              --arg relayer "$CHANGED_RELAYER" \
              --arg risk_webserver "$CHANGED_RISK_WEBSERVER" '
              {
                "ingester": $ingester,
                "fmd-indexer": $fmd_indexer,
                "explorer-indexer": $explorer_indexer,
                "fmd-webserver": $fmd_webserver,
                "explorer-webserver": $explorer_webserver,
                "relayer": $relayer,
                "risk-webserver": $risk_webserver
              } as $changes |
              [.[] | select(
                ($changes[.image] == "true") or (.needs_shared and $shared == "true")
              ) | del(.needs_shared)]
            ')
          fi

          has_changes=$( [ "$matrix" == "[]" ] && echo "false" || echo "true" )
          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"
          echo "matrix={\"docker\":$matrix}" >> "$GITHUB_OUTPUT"

  docker:
    name: Docker (${{ matrix.docker.image }})
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    env:
      REGISTRY_URL: ghcr.io
      REPOSITORY: ${{ github.repository }}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_URL }}/${{ env.REPOSITORY }}
          flavor: |
            latest=auto
            prefix=${{ matrix.docker.image }}-
            suffix=
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          build-args: |
            PACKAGE=${{ matrix.docker.package }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.docker.image }}
          cache-to: type=gha,scope=${{ matrix.docker.image }},mode=max
