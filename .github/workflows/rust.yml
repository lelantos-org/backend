name: rust

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-rust
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.95"
          components: rustfmt
      - uses: extractions/setup-just@v2
      - run: just fmt

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.95"
          components: clippy
      - name: Install protoc and libclang
        # `circom-witnesscalc`'s build script generates the witness-graph reader
        # with prost-build, which shells out to `protoc`, and binds its C sources
        # with bindgen, which needs libclang. Without both, the relayer fails to
        # build on the runner.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libclang-dev
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just clippy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rui314/setup-mold@v1
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.95"
      - name: Install protoc and libclang
        # `circom-witnesscalc`'s build script generates the witness-graph reader
        # with prost-build, which shells out to `protoc`, and binds its C sources
        # with bindgen, which needs libclang. Without both, the relayer fails to
        # build on the runner.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libclang-dev
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - uses: extractions/setup-just@v2
      # Database-backed tests start their own Postgres container through the
      # runner's Docker daemon; nothing needs to be provisioned here.
      - run: just test --profile ci
      - run: just test-doc
      - name: Test report
        if: ${{ !cancelled() }}
        uses: test-summary/action@v2
        with:
          paths: target/nextest/ci/junit.xml
      - name: Upload JUnit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
