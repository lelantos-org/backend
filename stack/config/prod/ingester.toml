# Ingester — PROD template. Selected with STACK_ENV=prod; config/dev/ is the
# default. Override per-deployment via INGESTER_CHAIN_<id>_{RPC_URL,
# POOL_ADDRESS,START_BLOCK} — those only apply to chains declared below.

database_url = "postgres://postgres:postgres@postgres:5432/postgres"

# Arbitrum One. Override via INGESTER_CHAIN_42161_{RPC_URL,POOL_ADDRESS}.
[[chains]]
chain_id = 42161
rpc_url = "https://arb1.arbitrum.io/rpc"
pool_address = "0x2E77bAb062B0E551eDbB75597af2bd29268413F6"
start_block = 465459960
reorg_depth = 32
# Arbitrum produces a block roughly every 250ms, so a 1s poll spent most of its
# time waiting. The extra cost is eth_blockNumber plus one eth_getBlockByNumber
# per tick — the two cheapest calls a provider bills for.
block_poll_ms = 250
backfill_threshold = 50
backfill_concurrency = 4
chunk_blocks = 1000
