# Explorer indexer — DEV (local anvil stack).
# Mounted at /etc/explorer-indexer.toml.
#
# Flow analytics for explorer-ui: `asset_flows`, `yield_fee_events` and the
# materialized views over them. Reads no chain — everything needing an RPC, and
# every table the wallet or the relayer depends on, belongs to protocol-indexer.
#
# There is deliberately no [[chains]] block. Fields below are the complete set
# (see ExplorerIndexerConfig).

database_url = "postgres://postgres:postgres@postgres:5432/postgres"

# Poll interval for new raw events.
tick_ms = 500

# Max raw events consumed per tick.
batch = 500
