# Relayer — DEV (local anvil stack). Mounted at /etc/relayer.toml.
#
# Active by default; STACK_ENV=prod selects config/prod/relayer.toml instead.
#
# `apply_env_overlay` only rewrites chains that ALREADY EXIST here, so this
# 31337 block is what makes the RELAYER_CHAIN_31337_* vars written by
# scripts/deploy-contracts.sh take effect. Delete it and the deploy output is
# silently discarded.

database_url = "postgres://postgres:postgres@postgres:5432/postgres"
listen_addr = "0.0.0.0:3003"

[[chains]]
chain_id = 31337
# Overridden by RELAYER_CHAIN_31337_RPC_URL.
rpc_url = "http://anvil:8545"
# Overridden by RELAYER_CHAIN_31337_POOL_ADDRESS (the deployed MASP).
pool_address = "0x0000000000000000000000000000000000000000"
# Anvil deterministic account #1 — public test key, no secret. MASP enforces
# `pubInputs.relayer == msg.sender`, so this must match the address wallets
# pin as `relayerAddress` (0x70997970C51812dc3A010C7d01b50e0d17dc79C8).
# A placeholder zero key is NOT usable here: it fails secp256k1 validation in
# `Submitter::new` and aborts startup. Override with
# RELAYER_CHAIN_31337_SIGNER_KEY.
signer_key_hex = "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
receipt_timeout_s = 60
flush_interval_s = 5
flush_max_n = 8

# swap_wrapper_address / native_adapter_address are injected by deploy.sh via
# RELAYER_CHAIN_31337_{SWAP_WRAPPER,NATIVE_ADAPTER}_ADDRESS; left unset here so
# the matching endpoints stay disabled until a deploy has actually run.

# Served verbatim by `/chains` for wallets to boot from; the relayer reads
# none of it. `rpc_url` here is the browser-reachable endpoint, deliberately
# not the `rpc_url` above (`http://anvil:8545` only resolves inside compose).
[chains.public]
name = "anvil"
rpc_url = "http://localhost:8545"
tree_depth = 10
permit2_address = "0x5FbDB2315678afecb367f032d93F642f64180aa3"

# ── second chain, for exercising the frontend's chain switcher ───────────
#
# Points at the SAME anvil and the SAME pool as 31337. It exists so `/chains`
# returns two entries and `ChainSwitcher` stops hiding itself; it is not an
# independent deployment and nothing indexes it, so it shows zero leaves and
# no tokens.
#
# Two consequences worth knowing before relying on it:
#
#   * The relayer verifies its tree mirror against the chain root at boot
#     (`TreeMirror::verify_chain_root`). This entry's mirror is always empty,
#     because no indexer feeds chain 31338. So the relayer only boots while the
#     pool's tree is *also* empty — i.e. straight after `just down && just up`.
#     Once a deposit lands, the next relayer restart fails with
#     "tree mirror diverges from chain 31338". Remove this block, or wipe, to
#     recover.
#   * `pool_address` is hard-coded rather than injected: deploy-contracts.sh
#     emits `RELAYER_CHAIN_31337_*` only, so the env overlay never touches this
#     entry. The literal is safe because anvil deploys deterministically from
#     the same script, but it must be updated if the deploy order changes.
#
# A real second chain means a second anvil + deploy, and per-chain config in
# the three indexers.
[[chains]]
chain_id = 31338
rpc_url = "http://anvil:8545"
pool_address = "0x0165878A594ca255338adfa4d48449f69242Eb8F"
# Anvil deterministic account #1 — public test key, same as 31337 above.
signer_key_hex = "0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d"
receipt_timeout_s = 60
flush_interval_s = 5
flush_max_n = 8

[chains.public]
name = "anvil-2"
rpc_url = "http://localhost:8545"
tree_depth = 10
permit2_address = "0x5FbDB2315678afecb367f032d93F642f64180aa3"

[prover]
# Mounted from backend/stack/circuits/ (populated by `just fetch-circuits`).
wasm_path = "/circuits/tree_update_batch.wasm"
r1cs_path = "/circuits/tree_update_batch.r1cs"
zkey_path = "/circuits/tree_update_batch_final.zkey"
