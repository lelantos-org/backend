# MetaQuoter config. Mounted at /etc/metaquoter.toml in the container.
# Override per-deployment via env: METAQUOTER_CHAIN_<id>_RPC_URL etc.

listen_addr = "0.0.0.0:8081"
race_deadline_ms = 1500

# Mainnet
[[chains]]
chain_id = 1
rpc_url = "https://eth.llamarpc.com"
univ3_quoter = "0x61fFE014bA17989E743c5F6cB21bF9697530B21e"
# Replace with deployed UniV3Adapter address.
univ3_adapter = "0x0000000000000000000000000000000000000000"
masp_fee_bps = 0

